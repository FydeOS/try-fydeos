name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make test

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum
      - run: make win-test
      - run: make win-build

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: make app-test
